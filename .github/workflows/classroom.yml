name: Autograding

on:
  push:
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Warm the Maven cache
        run: mvn -B -q -DskipTests install

      - name: "01 Sandbox"
        id: ex01
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "01 Sandbox"
          command: mvn -B -q -pl 'part01-Part01_01.Sandbox' test
          timeout: 5
          max-score: 1
      - name: "02 Ada Lovelace"
        id: ex02
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "02 Ada Lovelace"
          command: mvn -B -q -pl 'part01-Part01_02.AdaLovelace' test
          timeout: 5
          max-score: 1
